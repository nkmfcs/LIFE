server {
    listen 80;
    server_name diary.dukonos.com;

    # После certbot этот блок заменится на redirect → https
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name diary.dukonos.com;

    # SSL — будет заполнено certbot-ом автоматически
    # ssl_certificate     /etc/letsencrypt/live/diary.dukonos.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/diary.dukonos.com/privkey.pem;

    # Таймауты для Next.js
    proxy_read_timeout   60s;
    proxy_connect_timeout 60s;
    proxy_send_timeout   60s;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Кешируем статику Next.js (_next/static)
        location ~* ^/_next/static/ {
            proxy_pass http://127.0.0.1:3002;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
